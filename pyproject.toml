[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bpsd-xml-yolo-aligner"
version = "0.6.0"
description = "Lossless BPSD MusicXML, YOLO, and BPS-OMR alignment with CLI and web UI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "defusedxml>=0.7.1,<0.8",
  "numpy>=2.0,<3.0",
  "pillow>=12.3,<13.0",
  "pymupdf>=1.26,<2.0",
  "pypdf>=6.15,<7.0",
  "streamlit>=1.40,<2.0",
]

[project.optional-dependencies]
dev = ["pytest>=9.1,<10.0", "ruff>=0.12,<1.0"]

[project.scripts]
bpsd-aligner = "bpsd_aligner.cli:main"

[tool.setuptools]
packages = ["bpsd_aligner"]

[tool.setuptools.package-data]
bpsd_aligner = ["zoomable_image_frontend/*.html", "zoomable_image_frontend/*.js", "zoomable_image_frontend/*.css"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
exclude = ["build", "output", "validation_smoke"]
